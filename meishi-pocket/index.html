<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>名刺ポケット</title>
  <style>
    html,
    body {
      margin: 0;
      min-height: 100%;
      background: #dbeafe;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic", sans-serif;
    }

    .app-frame {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      border: 0;
      background: #dbeafe;
    }

    .home-link {
      position: fixed;
      z-index: 10;
      top: 22px;
      right: max(18px, calc((100vw - 48rem) / 2 + 18px));
      display: grid;
      width: 72px;
      height: 72px;
      place-items: center;
      border-radius: 999px;
      background: #2d8de0;
      color: #fff;
      box-shadow: 0 10px 22px rgba(37, 99, 235, .32);
      text-decoration: none;
    }

    .home-link:focus-visible {
      outline: 4px solid #93c5fd;
      outline-offset: 4px;
    }

    .home-link svg {
      width: 34px;
      height: 34px;
      fill: none;
      stroke: currentColor;
      stroke-linecap: round;
      stroke-linejoin: round;
      stroke-width: 2.4;
    }

    @media (max-width: 640px) {
      .home-link {
        top: 16px;
        right: 16px;
        width: 60px;
        height: 60px;
      }

      .home-link svg {
        width: 29px;
        height: 29px;
      }
    }
  </style>
</head>
<body>
  <iframe
    class="app-frame"
    src="https://business-card-line-app-nsl-inky.vercel.app/cards?token=388599201de594a2ca83cfcb5fde91845aed51deff63c4790a00a664de03b5ee&amp;q=&amp;sort=newest"
    title="名刺ポケット"
    allow="camera"
  ></iframe>
  <a
    class="home-link"
    href="https://rsp51522-lab.github.io/nextsaleslab-demo/?mode=toolbox"
    aria-label="業務メニューのホームへ戻る"
    title="業務メニューへ戻る"
  >
    <svg viewBox="0 0 24 24" aria-hidden="true">
      <path d="m3 11 9-8 9 8"></path>
      <path d="M5 10v10h14V10"></path>
      <path d="M9 20v-6h6v6"></path>
    </svg>
  </a>
</body>
</html>
