<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>請求書作成 | NSL相談所</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f1f5f9;color:#172033;font-family:Arial,"Hiragino Kaku Gothic ProN","Hiragino Sans","Yu Gothic",Meiryo,sans-serif;font-size:16px}header{background:#17324d;color:white;padding:22px 24px}header div{max-width:1280px;margin:auto;display:flex;align-items:center;justify-content:space-between;gap:16px}h1{font-size:24px;margin:0}a{color:inherit}main{max-width:1400px;margin:24px auto;padding:0 20px;display:grid;grid-template-columns:minmax(320px,460px) minmax(0,1fr);gap:24px;align-items:start}.editor{background:white;padding:24px;border:1px solid #d9e2ec;border-radius:12px}.editor h2{font-size:20px;margin:0 0 16px}.editor h3{font-size:17px;margin:24px 0 12px}.fields{display:grid;grid-template-columns:1fr 1fr;gap:12px}.wide{grid-column:1/-1}label{display:grid;gap:6px;font-size:14px;font-weight:bold}input,textarea,select{font:inherit;border:1px solid #b9c8d9;border-radius:6px;padding:10px;width:100%;min-width:0;background:white;color:#172033}textarea{resize:vertical;line-height:1.6}button{font:inherit;cursor:pointer;border:0;border-radius:6px;background:#0f766e;color:white;padding:11px 16px;font-weight:bold}button.secondary{background:#e7eef5;color:#17324d}button.remove{background:white;color:#b91c1c;border:1px solid #fecaca;font-size:13px;padding:7px 10px}.item-editor{padding:14px 0;border-bottom:1px solid #d9e2ec}.item-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}.item-head strong{font-size:14px}.item-fields{display:grid;grid-template-columns:1fr 1fr;gap:10px}.item-fields label:first-child{grid-column:1/-1}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}.note{font-size:13px;color:#64748b;line-height:1.6}.preview{min-width:0}.preview-bar{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;margin:0 0 12px}.preview-bar h2{font-size:18px;margin:0}.preview-scroll{overflow:auto;padding:0 0 16px}.invoice-paper{position:relative;background:#fff;width:210mm;min-height:296mm;color:#000;font-family:Arial,"Hiragino Kaku Gothic ProN","Hiragino Sans",Meiryo,sans-serif;font-size:9.5pt;line-height:1.2;box-shadow:0 2px 14px #17324d20;padding:0}.invoice-meta{position:absolute;right:12.35mm;top:10mm;text-align:right;font-size:10.5pt;line-height:1.3}.invoice-meta div+div{margin-top:3.4mm}.invoice-title{position:absolute;top:28mm;left:0;width:100%;text-align:center;font-size:24pt;font-weight:bold;margin:0}.invoice-recipient{position:absolute;top:44mm;left:12.35mm;width:94mm;font-size:14pt;font-weight:bold;line-height:1.45}.invoice-recipient span{border-bottom:0.6pt solid #000;overflow-wrap:anywhere}.invoice-issuer{position:absolute;top:44mm;left:112.9mm;width:84mm;font-size:10.5pt;white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.15}.invoice-issuer .issuer-address{margin-top:5.3mm;font-size:9.5pt}.invoice-issuer .issuer-phone{margin-top:5mm;font-size:9.5pt}.invoice-subject{position:absolute;left:12.35mm;top:55.7mm;width:94mm;font-size:9.5pt;line-height:1.4;overflow-wrap:anywhere}.invoice-greeting{position:absolute;left:12.35mm;top:63.5mm;margin:0}.invoice-total-top{position:absolute;left:12.35mm;top:71.6mm;width:81.2mm;border-bottom:0.6pt solid #000;display:flex;justify-content:space-between;gap:4mm;font-size:12pt;padding:0 0 1mm;line-height:1.2}.invoice-due{position:absolute;left:12.35mm;top:82.5mm;font-size:9.5pt}.invoice-table-area{padding:92.71mm 12.35mm 0;width:100%}.invoice-items{border-collapse:collapse;width:100%;table-layout:fixed;font-size:9.5pt}.invoice-items th,.invoice-items td{border:0.6pt solid #000;height:8.82mm;padding:1.5mm 2.5mm;line-height:1.25;overflow-wrap:anywhere}.invoice-items th{background:#d9d9d9;text-align:center;font-weight:bold;border-top-width:1pt}.invoice-items th:first-child,.invoice-items td:first-child{border-left-width:1pt}.invoice-items th:last-child,.invoice-items td:last-child{border-right-width:1pt}.invoice-items tbody tr:last-child td{border-bottom-width:1pt}.invoice-items td:not(:first-child){text-align:right}.invoice-items col:nth-child(1){width:60%}.invoice-items col:nth-child(2){width:12.76%}.invoice-items col:nth-child(3){width:12.38%}.invoice-items col:nth-child(4){width:14.86%}.invoice-sums{border-collapse:collapse;width:40%;margin-left:auto;font-size:9.5pt}.invoice-sums th,.invoice-sums td{border:0.6pt solid #000;height:8.82mm;padding:1.5mm 2.5mm;font-weight:normal}.invoice-sums th{text-align:left;width:62.85%;border-left-width:1pt}.invoice-sums td{text-align:right;border-right-width:1pt}.invoice-sums tr:last-child th,.invoice-sums tr:last-child td{border-bottom-width:1pt}.invoice-bank{margin:4.9mm 0 0;white-space:pre-wrap;line-height:1.4;font-size:10.5pt;overflow-wrap:anywhere;padding-bottom:12mm}.invoice-bank strong{font-weight:bold}#status{font-size:14px;color:#0f766e;min-height:20px;margin-top:12px}button:disabled{opacity:.6;cursor:wait}input:focus,textarea:focus,button:focus-visible,a:focus-visible{outline:3px solid #93c5fd;outline-offset:2px}@page{size:A4;margin:0}@media(max-width:1100px){main{grid-template-columns:1fr}.editor{max-width:none}}@media(max-width:520px){main{padding:0 10px;margin:12px auto}.editor{padding:16px}header{padding:16px}h1{font-size:21px}.fields{grid-template-columns:1fr}.actions button{flex:1}.preview-bar button{font-size:14px}.preview-scroll{border:1px solid #d9e2ec}.note{margin:8px 0}}@media print{html,body{margin:0!important;padding:0!important;background:#fff!important}body>header,.editor,.preview-bar,.preview>.note,#status{display:none!important}main{display:block!important;margin:0!important;padding:0!important;max-width:none!important}.preview-scroll{overflow:visible!important;margin:0!important;padding:0!important;border:0!important}.invoice-paper{box-shadow:none!important;margin:0!important;print-color-adjust:exact;-webkit-print-color-adjust:exact}.invoice-items tr,.invoice-sums tr,.invoice-bank{break-inside:avoid}}
</style>
</head>
<body>
<header><div><h1>請求書作成</h1><a href="./?mode=toolbox">業務メニューへ戻る</a></div></header>
<main>
<section class="editor" aria-label="請求書の入力">
<h2>請求内容を入力</h2><p class="note">宛名・明細を入力すると、右の請求書に反映されます。金額は税抜で入力してください。</p>
<form id="invoice-form">
<div class="fields">
<label class="wide">宛名<input id="recipient" required maxlength="100" autocomplete="organization" placeholder="会社名・お客様名"></label>
<label>敬称<select id="honorific"><option>御中</option><option>様</option><option value="">なし</option></select></label>
<label>請求番号<input id="number" required maxlength="60"></label>
<label>発行日<input id="issueDate" type="date" required></label>
<label>お支払い期限<input id="dueDate" type="date" required></label>
<label class="wide">件名<input id="subject" maxlength="100" placeholder="アプリ導入サポート費など"></label>
</div>
<h3>明細</h3><div id="items-editor"></div><div class="actions"><button type="button" id="add-item" class="secondary">＋ 明細を追加</button></div>
<h3>発行元・お振込先</h3><div class="fields">
<label class="wide">発行元<input id="issuer" value="NSL相談所" required maxlength="80"></label>
<label class="wide">住所<textarea id="issuerAddress" rows="2" maxlength="200">〒323-0807
栃木県小山市城東7-6-11</textarea></label>
<label class="wide">電話番号<input id="issuerPhone" value="0285-39-6600" type="tel" maxlength="40"></label>
<label class="wide">お振込先<textarea id="bank" rows="2" maxlength="300">三井住友銀行　人形町支店(普)1230219　カシマ チカ</textarea></label>
<label>消費税率（%）<input id="taxRate" type="number" value="10" min="0" max="100" step="0.1" required></label>
</div>
<div class="actions"><button type="button" id="save-draft" class="secondary">下書きを保存</button><button type="button" id="load-draft" class="secondary">下書きを読込</button></div>
<div class="actions"><button type="button" id="sample" class="secondary">クララの見本を入力</button><button type="button" id="clear" class="secondary">新しい請求書</button></div>
<p class="note">下書きはこのブラウザーに保存します。PDF保存・印刷はメール送信を行いません。</p>
</form>
</section>
<section class="preview" aria-label="請求書プレビュー">
<div class="preview-bar"><h2>A4プレビュー</h2><div class="actions" style="margin:0"><button id="download" type="button">PDFを保存</button><button id="print" type="button" class="secondary">印刷</button></div></div>
<p id="status" role="status" aria-live="polite"></p>
<div class="preview-scroll"><article class="invoice-paper" id="invoice-paper">
<div class="invoice-meta"><div id="p-date"></div><div>請求番号: <span id="p-number"></span></div></div>
<h2 class="invoice-title">請求書</h2>
<div class="invoice-recipient"><span id="p-recipient"></span></div>
<div class="invoice-issuer"><div id="p-issuer"></div><div id="p-address" class="issuer-address"></div><div class="issuer-phone">TEL: <span id="p-phone"></span></div></div>
<div class="invoice-subject">件名 : <span id="p-subject"></span></div>
<p class="invoice-greeting">下記のとおりご請求申し上げます。</p>
<div class="invoice-total-top"><span>ご請求金額</span><span id="p-total-top"></span></div>
<div class="invoice-due">お支払い期限 : <span id="p-due"></span></div>
<div class="invoice-table-area"><table class="invoice-items"><colgroup><col><col><col><col></colgroup><thead><tr><th>品番・品名</th><th>数量</th><th>単価</th><th>金額</th></tr></thead><tbody id="p-items"></tbody></table>
<table class="invoice-sums"><tbody><tr><th>小計</th><td id="p-subtotal"></td></tr><tr><th>消費税 (<span id="p-rate"></span>%)</th><td id="p-tax"></td></tr><tr><th>合計</th><td id="p-total"></td></tr></tbody></table>
<div class="invoice-bank"><strong>お振込先：</strong><br><span id="p-bank"></span></div></div>
</article></div>
<p class="note">横に動かすと用紙全体を確認できます。明細が多い場合は複数ページになります。</p>
</section></main>
<script src="https://cdn.jsdelivr.net/npm/html2pdf.js@0.10.1/dist/html2pdf.bundle.min.js"></script>
<script>
'use strict';
const $=id=>document.getElementById(id);
const fieldIds=['recipient','honorific','number','issueDate','dueDate','subject','issuer','issuerAddress','issuerPhone','bank','taxRate'];
const DRAFT_KEY='nsl-invoice-draft-v1';
let items=[{name:'',quantity:1,price:0}];
const localDate=date=>`${date.getFullYear()}-${String(date.getMonth()+1).padStart(2,'0')}-${String(date.getDate()).padStart(2,'0')}`;
const jpDate=value=>{const parts=String(value||'').split('-');return parts.length===3?`${Number(parts[0])}年${Number(parts[1])}月${Number(parts[2])}日`:'';};
const fmt=n=>Number(n).toLocaleString('ja-JP',{maximumFractionDigits:2});
const text=(id,value)=>{$(id).textContent=value;};
const status=message=>text('status',message);
function numberFor(date){return date.replaceAll('-','')+'-'+String(Date.now()).slice(-6);}
function newInvoice(){const now=new Date();$('recipient').value='';$('honorific').value='御中';$('subject').value='';$('issueDate').value=localDate(now);$('dueDate').value=localDate(new Date(now.getFullYear(),now.getMonth()+1,0));$('number').value=numberFor($('issueDate').value);items=[{name:'',quantity:1,price:0}];renderEditors();render();}
function calculate(){const lines=items.map(item=>Math.round(Number(item.quantity||0)*Number(item.price||0)));const subtotal=lines.reduce((a,b)=>a+b,0);const tax=Math.floor(subtotal*Number($('taxRate').value||0)/100);return {lines,subtotal,tax,total:subtotal+tax};}
function renderEditors(){const container=$('items-editor');container.replaceChildren();items.forEach((item,index)=>{const div=document.createElement('div');div.className='item-editor';const head=document.createElement('div');head.className='item-head';const title=document.createElement('strong');title.textContent=`明細 ${index+1}`;const remove=document.createElement('button');remove.type='button';remove.className='remove';remove.textContent='削除';remove.setAttribute('aria-label',`明細${index+1}を削除`);remove.onclick=()=>{items.splice(index,1);renderEditors();render();};head.append(title,remove);const fields=document.createElement('div');fields.className='item-fields';[['name','品番・品名','text'],['quantity','数量','number'],['price','単価（税抜・割引はマイナス）','number']].forEach(([key,labelText,type])=>{const label=document.createElement('label');label.append(document.createTextNode(labelText));const input=document.createElement('input');input.type=type;input.value=item[key];if(type==='number'){input.step=key==='quantity'?'0.01':'1';if(key==='quantity')input.min='0';}else input.maxLength=500;input.addEventListener('input',()=>{items[index][key]=type==='number'?Number(input.value):input.value;render();});label.append(input);fields.append(label);});div.append(head,fields);container.append(div);});}
function render(){const sums=calculate();text('p-date',jpDate($('issueDate').value));text('p-number',$('number').value);text('p-recipient',[$('recipient').value,$('honorific').value].filter(Boolean).join(' '));text('p-issuer',$('issuer').value);text('p-address',$('issuerAddress').value);text('p-phone',$('issuerPhone').value);text('p-subject',$('subject').value);text('p-due',jpDate($('dueDate').value));text('p-bank',$('bank').value);text('p-rate',$('taxRate').value);text('p-subtotal',fmt(sums.subtotal));text('p-tax',fmt(sums.tax));text('p-total',fmt(sums.total));text('p-total-top','¥ '+fmt(sums.total)+' -');const tbody=$('p-items');tbody.replaceChildren();for(let index=0;index<Math.max(10,items.length);index++){const tr=document.createElement('tr');const item=items[index];const values=item?[item.name,fmt(item.quantity),fmt(item.price),fmt(sums.lines[index])]:['','','',''];values.forEach(value=>{const td=document.createElement('td');td.textContent=value;tr.append(td);});tbody.append(tr);}}
function valid(){if(!$('invoice-form').reportValidity())return false;if(!items.length||!items.some(item=>item.name.trim()&&Number(item.quantity)>0)){status('品番・品名と数量を1件以上入力してください。');return false;}if(items.some(item=>!item.name.trim()||!Number.isFinite(Number(item.quantity))||Number(item.quantity)<=0||!Number.isFinite(Number(item.price)))){status('すべての明細に品番・品名と0より大きい数量、単価を入力してください。');return false;}render();return true;}
function snapshot(){return {version:1,fields:Object.fromEntries(fieldIds.map(id=>[id,$(id).value])),items:items.map(item=>({...item}))};}
$('invoice-form').addEventListener('submit',event=>event.preventDefault());
fieldIds.forEach(id=>$(id).addEventListener('input',render));
$('add-item').onclick=()=>{items.push({name:'',quantity:1,price:0});renderEditors();render();};
$('save-draft').onclick=()=>{try{localStorage.setItem(DRAFT_KEY,JSON.stringify(snapshot()));status('このブラウザーに下書きを保存しました。');}catch{status('このブラウザーでは下書きを保存できません。PDF保存をご利用ください。');}};
$('load-draft').onclick=()=>{try{const raw=localStorage.getItem(DRAFT_KEY);if(!raw){status('保存した下書きがありません。');return;}const data=JSON.parse(raw);if(data.version!==1||!Array.isArray(data.items)||data.items.length>100)throw Error();if(!confirm('入力内容を保存済みの下書きに置き換えますか？'))return;fieldIds.forEach(id=>{if(typeof data.fields?.[id]==='string')$(id).value=data.fields[id];});items=data.items.map(item=>({name:String(item.name||''),quantity:Number(item.quantity)||0,price:Number(item.price)||0}));renderEditors();render();status('下書きを読み込みました。');}catch{status('下書きを読み込めませんでした。');}};
$('sample').onclick=()=>{if(!confirm('入力内容をクララの見本に置き換えますか？'))return;$('recipient').value='エモーション・クララ';$('honorific').value='様';$('number').value='20261011-002';$('issueDate').value='2026-10-11';$('dueDate').value='2026-10-31';$('subject').value='アプリ導入サポート費・名刺読込作業代行';$('issuer').value='NSL相談所';$('issuerAddress').value='〒323-0807\n栃木県小山市城東7-6-11';$('issuerPhone').value='0285-39-6600';$('bank').value='三井住友銀行　人形町支店(普)1230219　カシマ チカ';$('taxRate').value='10';items=[['LINE領収書・名刺アプリ',1,15000],['業務AI効率化',1,50000],['名刺読込',1026,20],['名刺データ移行',1,5000],['割引',1,-15000]].map(([name,quantity,price])=>({name:'[2026/10/11 納品分] '+name,quantity,price}));renderEditors();render();status('クララの見本を入力しました。請求金額は83,072円です。');};
$('clear').onclick=()=>{if(confirm('入力内容を消して新しい請求書を作成しますか？')){newInvoice();status('新しい請求書を作成しました。');}};
$('print').onclick=()=>{if(valid())window.print();};
$('download').onclick=async()=>{if(!valid())return;const button=$('download');button.disabled=true;status('PDFを作成しています。');try{if(!window.html2pdf){status('PDF保存機能を読み込めません。印刷ボタンから「PDFに保存」を選択してください。');return;}const filename=($('recipient').value+'_請求書_'+$('number').value).replace(/[\\/:*?"<>|]/g,'_')+'.pdf';await html2pdf().set({filename,margin:0,image:{type:'jpeg',quality:0.98},html2canvas:{scale:2,useCORS:true,backgroundColor:'#ffffff',scrollX:0,scrollY:0,onclone:doc=>{const paper=doc.getElementById('invoice-paper');if(paper)paper.style.boxShadow='none';}},jsPDF:{unit:'mm',format:'a4',orientation:'portrait'},pagebreak:{mode:['css','legacy'],avoid:['tr','.invoice-bank']}}).from($('invoice-paper')).save();status('PDFを保存しました。');}catch{status('PDFを保存できませんでした。印刷ボタンから「PDFに保存」を選択してください。');}finally{button.disabled=false;}};
newInvoice();
</script></body></html>
