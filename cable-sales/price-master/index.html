<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>営業単価マスター</title><link rel="stylesheet" href="../style.css"><link rel="stylesheet" href="../sidebar.css"><style>.controls{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:22px 0}.controls input{font:inherit;padding:12px;border:1px solid #b8cede;border-radius:9px;flex:1;min-width:230px}.secondary{border:1px solid #aac0d2;border-radius:9px;background:#fff;padding:11px 15px;font:inherit;cursor:pointer}.master-table input{font:inherit;width:125px;padding:8px;border:1px solid #afc4d6;border-radius:7px;text-align:right}.master-table td:nth-child(2),.master-table td:nth-child(3){text-align:left}.master-table th{text-align:left}.master-table td:last-child{text-align:right}.master-table tr.changed{background:#fff7e8}.master-table table{min-width:750px}a{color:#176a9c}</style></head><body><main class="shell"><header><div class="brand"><span class="mark">NSL</span><span>営業単価マスター</span></div><a href="../">売上集計に戻る</a></header><section class="workspace" style="display:block;padding:34px 0 14px"><p class="eyebrow">PRICE MASTER</p><h1>営業の単価表</h1><p class="sub">商品単価を変更すると、この端末の売上集計画面の参考計算に反映します。月末の確定売上とキャンセル金額は、毎月の確定ファイルを優先します。</p></section><div class="controls"><input id="search" type="search" placeholder="商品名・区分・元列で検索"><button id="export" class="secondary">マスターを保存</button><label class="secondary">保存したマスターを読み込む<input id="import" type="file" accept=".json" hidden></label><button id="reset" class="secondary">初期単価に戻す</button></div><p id="status" class="notice" role="status"></p><div class="card"><div class="scroll master-table"><table><thead><tr><th>元列</th><th>種別</th><th>商品</th><th>初期単価</th><th>使用する単価</th></tr></thead><tbody id="rows"></tbody></table></div></div><p class="footnote">初期単価は「売上管理表.xlsx」の栃木PK単価行をもとにしています。端末を変えると単価の変更内容は引き継がれません。「マスターを保存」でバックアップし、別の端末では読み込んでください。</p></main><script type="module" src="./app.js"></script><script src="../sidebar.js"></script></body></html>
