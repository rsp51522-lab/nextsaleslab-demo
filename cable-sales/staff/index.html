<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>スタッフ申請</title><link rel="stylesheet" href="../style.css"><link rel="stylesheet" href="../sidebar.css"><style>.form{max-width:680px;display:grid;gap:16px}.form label{display:grid;gap:7px;font-weight:700}.form input,.form select,.form textarea{font:inherit;padding:12px;border:1px solid #b3c8d8;border-radius:9px;width:100%}.form textarea{min-height:120px}.actions{display:flex;gap:12px;flex-wrap:wrap}.secondary{font:inherit;padding:12px 18px;border:1px solid #afc5d6;border-radius:9px;background:#fff;cursor:pointer}</style></head><body><main class="shell"><header><div class="brand"><span class="mark">NSL</span><span>スタッフ申請</span></div></header><section class="workspace" style="display:block;padding:34px 0 20px"><p class="eyebrow">STAFF REQUEST</p><h1>スタッフ申請</h1><p>必要事項を入力して、申請書を保存してください。</p></section><form id="request" class="card form"><label>氏名<input name="name" autocomplete="name" required></label><label>部署<select name="department" required><option value="">選択してください</option><option>営業</option><option>メンテ</option><option>その他</option></select></label><label>申請内容<select name="type" required><option value="">選択してください</option><option>新規スタッフ</option><option>部署変更</option><option>情報変更</option></select></label><label>希望日<input name="date" type="date" required></label><label>申請者<input name="requester" required></label><label>備考<textarea name="note" placeholder="必要な連絡事項"></textarea></label><div class="actions"><button class="primary" type="submit">申請書を保存</button><button class="secondary" type="button" id="print">印刷</button></div><p id="status" class="notice" role="status">入力内容はこの画面内で処理します。保存した申請書を社内の担当者に渡してください。</p></form></main><script src="../sidebar.js"></script><script type="module" src="./app.js"></script></body></html>
